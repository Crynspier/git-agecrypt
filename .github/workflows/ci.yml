name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Code Formatting & Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Verify documentation contains no machine-local links
        run: |
          if grep -rE "file:///[A-Za-z]:" docs/; then
            echo "Error: Machine-local absolute file:/// paths found in docs/"
            exit 1
          fi

  clippy:
    name: Linter (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # H5: enforce the declared MSRV (rust-version = "1.88.0" in Cargo.toml).
  msrv:
    name: MSRV Check (Rust 1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check MSRV build
        run: cargo check --workspace --locked --verbose

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install external age CLI for clean-room interop tests
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run tests
        env:
          GIT_AGECRYPT_REQUIRE_AGE_CLI: "1"
        run: cargo test --workspace --locked --verbose
      - name: Check fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Compile benchmarks
        run: cargo bench --no-run --locked --verbose

  deny:
    name: Supply Chain Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build workspace
        run: cargo build --workspace --locked --verbose

  platform-matrix:
    name: Platform Build and Smoke Test (${{ matrix.platform_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: git-agecrypt
          - os: macos-15-intel
            platform_name: macOS Intel
            target: x86_64-apple-darwin
            binary_name: git-agecrypt
          - os: macos-14
            platform_name: macOS Apple Silicon
            target: aarch64-apple-darwin
            binary_name: git-agecrypt
          - os: windows-latest
            platform_name: Windows x86_64
            target: x86_64-pc-windows-msvc
            binary_name: git-agecrypt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "Platform Tester"
          git config --global user.email "platform@example.com"
      - name: Build release binary
        run: cargo build --release --locked --verbose
      - name: Run platform smoke tests
        shell: bash
        run: |
          ./target/release/${{ matrix.binary_name }} --help
          ./target/release/${{ matrix.binary_name }} --version
      - name: Run native macOS integration tests
        if: runner.os == 'macOS'
        run: cargo test --test test_durability --verbose
      - name: Run native Windows integration tests
        if: runner.os == 'Windows'
        run: cargo test --test test_durability --verbose
