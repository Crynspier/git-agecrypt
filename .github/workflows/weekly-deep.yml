name: Weekly Deep Verification

on:
  schedule:
    - cron: '0 4 * * 0' # Run at 04:00 UTC every Sunday
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-generative-10k:
    name: Deep Generative Model Check (10,000 ops, 5 seeds)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: ["11111111", "22222222", "33333333", "44444444", "55555555"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run 10,000 Step Generative State Machine (seed ${{ matrix.seed }})
        env:
          GIT_AGECRYPT_OPS: "10000"
          GIT_AGECRYPT_SEED: ${{ matrix.seed }}
        run: cargo test --release --test test_generative_shadow_state_machine -- --nocapture

  crash-matrix-full:
    name: 24-Point Crash Injection Matrix (3 seeds)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: ["AAAA0001", "BBBB0002", "CCCC0003"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Deterministic SIGKILL Crash Suite (seed ${{ matrix.seed }})
        env:
          GIT_AGECRYPT_SEED: ${{ matrix.seed }}
        run: cargo test --release --test test_sigkill_crash_injection -- --nocapture

  concurrency-crash-matrix:
    name: Concurrency × Crash Injection Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Concurrency × Crash Matrix
        run: cargo test --release --test test_concurrency_crash_matrix -- --nocapture

  race-matrix:
    name: Race Matrix (2/4/8/16/32 workers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4, 8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Mixed Concurrency Stress (${{ matrix.workers }} workers)
        run: cargo test --release --test test_mixed_concurrency_stress -- --nocapture

  large-file-crash-matrix:
    name: Large-File Crash Matrix (1MiB/4MiB/16MiB/100MiB)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: ["1048576", "4194304", "16777216", "104857600"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Large-File Crash Test (${{ matrix.size }} bytes)
        env:
          GIT_AGECRYPT_LARGE_FILE_SIZE: ${{ matrix.size }}
        run: cargo test --release --test test_large_file_crash_spool -- --nocapture

  ring-dag-generative:
    name: Generative Ring × Generation × DAG (3 seeds)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: ["DDDD0001", "EEEE0002", "FFFF0003"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Generative Ring DAG (seed ${{ matrix.seed }})
        env:
          GIT_AGECRYPT_SEED: ${{ matrix.seed }}
        run: cargo test --release --test test_generative_ring_dag -- --nocapture

  performance-benchmark:
    name: Performance Benchmark Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Benchmarks
        env:
          GIT_AGECRYPT_BENCH_JSON: "1"
          GIT_AGECRYPT_BENCH_OUT: bench-results.json
        run: cargo bench --release
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn

  cross-platform-crash-matrix:
    name: Crash Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run Crash Injection Suite
        run: cargo test --release --test test_sigkill_crash_injection -- --nocapture
      - name: Run Power-Loss Torn-Write Audit
        run: cargo test --release --test test_power_loss_durability -- --nocapture

  power-loss-block-layer:
    name: True Power-Loss (dm-flakey, block layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Run dm-flakey power-cut test as root
        run: sudo env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" cargo test --release --test test_power_loss_durability test_dm_flakey_true_power_loss -- --exact --nocapture

  replay-shrink-validation:
    name: Generative Replay + ddmin Shrinker Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git user identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
      - name: Generate ops log (seed A1B2C3D4, 60 ops)
        env:
          GIT_AGECRYPT_SEED: "A1B2C3D4"
          GIT_AGECRYPT_OPS: "60"
          GIT_AGECRYPT_OPS_LOG: /tmp/weekly-ops.log
        run: cargo test --release --test test_generative_shadow_state_machine -- --exact test_deep_generative_shadow_model_state_machine --nocapture
      - name: Replay the recorded ops log exactly
        env:
          GIT_AGECRYPT_REPLAY: /tmp/weekly-ops.log
        run: cargo test --release --test test_generative_shadow_state_machine -- --exact test_replay_ops_log --nocapture
      - name: Validate ddmin shrinker machinery (self-test)
        run: cargo test --release --test test_generative_shadow_state_machine -- --exact test_ddmin_shrinker_selftest --nocapture
