[advisories]
unmaintained = "none"
ignore = [
    # RUSTSEC-2023-0071: Marvin timing side-channel attack on rsa crate (transitive dep of age 0.12.1).
    # No patched release exists yet from upstream. git-agecrypt runs as a local Git filter driver
    # and is not exposed as a remote network decryption oracle.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
